[package]
name = "pf-gui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "power-forensics desktop workbench (Tauri shell; forensic truth stays in pf-core/pf-agent)"
build = "build.rs"

[lib]
name = "pf_gui"
path = "src/lib.rs"

[[bin]]
name = "power-forensics-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pf-core = { path = "../../pf-core" }
pf-agent = { path = "../../pf-agent" }
pf-collectors = { path = "../../pf-collectors" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
